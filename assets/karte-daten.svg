<text x="132" y="58" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#7dd3fc">Daten &amp; Märkte</text>
<text x="132" y="92" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">Öffentliche Daten, eigene Modelle –</text><text x="132" y="116" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">und eine ehrliche Rückrechnung,</text><text x="132" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">bevor irgendwer irgendwas glaubt.</text>
