<svg xmlns="http://www.w3.org/2000/svg" width="490" height="205" viewBox="0 0 490 205" role="img" aria-label="Daten &amp; Märkte: Öffentliche Daten, eigene Modelle – und eine ehrliche Rückrechnung, bevor irgendwer irgendwas glaubt.">
